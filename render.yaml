# =============================================
# Experience AI — déploiement Render
# Service distinct de TripGenie : ni la base, ni le service, ni l'URL
# ne sont partagés avec l'ancien projet.
# =============================================

services:
  - type: web
    name: experience-ai
    runtime: node
    region: frankfurt
    branch: main
    buildCommand: npm install && npx prisma migrate deploy && npx tsc && npm run client:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # --- Base de données ---
      # Propre à Experience AI : créer une nouvelle instance PostgreSQL sur Render
      # et coller son URL ici. Ne jamais réutiliser la base de TripGenie.
      - key: DATABASE_URL
        sync: false

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # --- LLM (au moins un fournisseur requis — repli automatique) ---
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # --- Données réelles (optionnelles — repli si absentes) ---
      - key: TAVILY_API_KEY
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: YELP_API_KEY
        sync: false
      - key: PREDICTHQ_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      # Open-Meteo : aucune clé requise

      # --- CORS ---
      # À remplacer par l'URL réelle du service une fois créé sur Render.
      - key: CLIENT_URL
        value: https://experience-ai.onrender.com
